<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login - Ideal College Clubs</title>
<link rel="stylesheet" href="staff.css">
</head>

<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="lock" aria-hidden="true">🔐</div>
    <h1>Staff Login</h1>
    <p class="sub">Sign in with the staff account assigned to you.</p>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>

    <form id="staffForm" autocomplete="on">
      <div class="field" style="margin-bottom:16px">
        <label for="email">Staff email</label>
        <div class="token-box">
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="token-box">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
      </div>

      <p class="hint">Your admin or coordinator access is assigned by the demo administrator.</p>
      <button type="submit" class="btn block" id="submitBtn">Sign in</button>
    </form>

    <div class="links">
      <a href="main.html">← Back to Home</a>
      <a href="logbtn.html">Student Login</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="staff.js"></script>
<script>
(function () {
  var form = document.getElementById("staffForm");
  var email = document.getElementById("email");
  var password = document.getElementById("password");
  var message = document.getElementById("msg");
  var submit = document.getElementById("submitBtn");

  function showMessage(text, kind) {
    message.textContent = text;
    message.className = "msg " + kind;
  }

  function goToDashboard(staff) {
    if (!staff) return;
    location.replace(staff.role === "admin" ? "admin.html" : "coordinator.html");
  }

  IdealStaff.currentStaff().then(goToDashboard).catch(function (error) {
    showMessage("Could not verify your staff session: " + error.message, "error");
  });

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    submit.disabled = true;
    showMessage("", "");

    IdealStaff.login(email.value, password.value).then(function (staff) {
      showMessage("Signed in. Opening your dashboard...", "ok");
      goToDashboard(staff);
    }).catch(function (error) {
      showMessage(error.message || "Sign-in failed. Please try again.", "error");
      submit.disabled = false;
    });
  });
})();
</script>
</body>
</html>
